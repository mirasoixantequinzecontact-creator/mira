<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mira — le tiers neutre</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            sand: {
              50: '#faf9f6', 100: '#f3f1ea', 200: '#e7e3d7', 300: '#d4cdba',
            },
          },
        },
      },
    };
  </script>
  <style>
    html, body, #root { height: 100%; }
    body { background: #f3f1ea; }
    @keyframes risein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .risein { animation: risein 0.45s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes softpulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    .softpulse { animation: softpulse 1.8s ease-in-out infinite; }
    @keyframes wave { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    .wavebar { animation: wave 1s ease-in-out infinite; transform-origin: center; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #d4cdba; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ──────────────────────────────────────────────────────────────
       SCÉNARIO DE DÉMO PRÉ-SCRIPTÉ
       Dispute familiale autour de la date d'anniversaire de Mamie.
       Chaque message est joué dans l'ordre, comme si le micro
       transcrivait la conversation en direct.

       `fact` (optionnel) = vérification factuelle simulée :
         - status: 'disputed'      → un fait vérifiable semble inexact
         - status: 'unverifiable'  → impossible à trancher sereinement
         - status: 'ok'            → fait vérifié exact (montré au résumé,
                                      pas signalé en direct pour rester discret)
       Les phrases SANS `fact` sont des opinions / jugements / ressentis :
       Mira ne s'en mêle jamais.
       ────────────────────────────────────────────────────────────── */
    const SCRIPT = [
      {
        id: 1, speaker: 'Papa', color: 'bg-[#cbb8a0]',
        text: "Mamie est née en 1949, ça j'en suis absolument certain.",
        fact: {
          status: 'disputed',
          claim: "Année de naissance de Mamie : 1949",
          note: "Le livret de famille partagé dans l'album indique 1947. Un écart de deux ans semble présent.",
          source: "Livret de famille (photo ajoutée le 12/03)",
        },
      },
      {
        id: 2, speaker: 'Maman', color: 'bg-[#a9c0b8]',
        text: "Tu dis toujours ça avec assurance et tu te trompes une fois sur deux.",
        // opinion / reproche → aucune intervention
      },
      {
        id: 3, speaker: 'Léa', color: 'bg-[#b8aecb]',
        text: "On a fêté ses 70 ans tous ensemble en 2019, je m'en souviens très bien.",
        fact: {
          status: 'unverifiable',
          claim: "70 ans fêtés en 2019",
          note: "Si la naissance est en 1947, les 70 ans tombaient plutôt en 2017. La date exacte de la fête n'est pas dans les éléments partagés — à confirmer entre vous.",
          source: "Recoupement des dates · non tranché",
        },
      },
      {
        id: 4, speaker: 'Papa', color: 'bg-[#cbb8a0]',
        text: "De toute façon ce repas a coûté une fortune, genre 500 euros pour le restaurant.",
        // chiffre invérifiable et hors sujet factuel public → pas d'intervention
      },
      {
        id: 5, speaker: 'Maman', color: 'bg-[#a9c0b8]',
        text: "Et son village, Saint-Privat, c'est à plus de 300 km de Lyon quand même.",
        fact: {
          status: 'disputed',
          claim: "Saint-Privat à « plus de 300 km » de Lyon",
          note: "La distance routière relevée est d'environ 210 km. L'estimation paraît plus élevée que la réalité.",
          source: "Distance routière de référence",
        },
      },
      {
        id: 6, speaker: 'Léa', color: 'bg-[#b8aecb]',
        text: "Bref. Je trouve qu'on devrait juste lui demander à elle, ce serait plus simple et plus gentil.",
        // proposition / jugement de valeur → aucune intervention
      },
    ];

    const STATUS_META = {
      disputed: {
        label: "À vérifier ensemble",
        dot: "#c9a36a",
        ring: "ring-[#e3d3b8]",
        bg: "bg-[#faf6ee]",
        icon: "≈",
      },
      unverifiable: {
        label: "Difficile à trancher",
        dot: "#9aa6b2",
        ring: "ring-[#d9dee4]",
        bg: "bg-[#f6f8fa]",
        icon: "?",
      },
      ok: {
        label: "Vérifié exact",
        dot: "#8aa893",
        ring: "ring-[#cfe0d4]",
        bg: "bg-[#f3f8f4]",
        icon: "✓",
      },
    };

    /* ── Petit logo apaisant ── */
    function Mark({ size = 40, animated = false }) {
      return (
        <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
          <div className={"absolute inset-0 rounded-full bg-[#a9c0b8]/30 " + (animated ? "softpulse" : "")}></div>
          <div className="absolute rounded-full bg-[#8aa893]" style={{ width: size*0.34, height: size*0.34 }}></div>
        </div>
      );
    }

    /* ── Visualiseur d'onde sonore (simulé) ── */
    function Waveform({ active }) {
      const bars = [0.4,0.7,1,0.6,0.85,0.5,0.95,0.65,0.45,0.8,0.55];
      return (
        <div className="flex items-center gap-[3px] h-6">
          {bars.map((b, i) => (
            <div
              key={i}
              className={"w-[3px] rounded-full bg-[#8aa893] " + (active ? "wavebar" : "")}
              style={{ height: (b*100)+"%", animationDelay: (i*0.09)+"s", opacity: active ? 1 : 0.25 }}
            />
          ))}
        </div>
      );
    }

    /* ── Carte de signalement discrète ── */
    function FactCard({ fact }) {
      const m = STATUS_META[fact.status];
      return (
        <div className={"risein mt-2 mb-1 rounded-2xl ring-1 " + m.ring + " " + m.bg + " px-4 py-3 shadow-sm"}>
          <div className="flex items-center gap-2 mb-1.5">
            <span
              className="flex items-center justify-center w-5 h-5 rounded-full text-[11px] font-semibold text-white"
              style={{ background: m.dot }}
            >{m.icon}</span>
            <span className="text-[11px] font-medium uppercase tracking-wider text-stone-500">{m.label}</span>
          </div>
          <p className="text-sm font-medium text-stone-700">{fact.claim}</p>
          <p className="text-sm text-stone-600 mt-1 leading-relaxed">{fact.note}</p>
          <p className="text-[11px] text-stone-400 mt-2 flex items-center gap-1">
            <span className="inline-block w-1 h-1 rounded-full bg-stone-300"></span>
            Source : {fact.source}
          </p>
        </div>
      );
    }

    /* ─────────────────────  ÉCRAN 1 — CONSENTEMENT  ───────────────────── */
    function ConsentScreen({ onStart }) {
      const participants = ["Papa", "Maman", "Léa"];
      const [agreed, setAgreed] = useState({});
      const all = participants.every(p => agreed[p]);

      return (
        <div className="min-h-full flex items-center justify-center p-5">
          <div className="w-full max-w-lg bg-white rounded-3xl shadow-[0_10px_40px_-15px_rgba(80,70,50,0.25)] p-7 risein">
            <div className="flex items-center gap-3 mb-5">
              <Mark size={44} />
              <div>
                <h1 className="text-xl font-semibold text-stone-800">Mira</h1>
                <p className="text-xs text-stone-500">un tiers neutre, jamais un arbitre</p>
              </div>
            </div>

            <div className="rounded-2xl bg-sand-100 p-4 mb-5">
              <p className="text-sm text-stone-700 leading-relaxed">
                Avant toute écoute, <span className="font-medium">chaque personne présente doit accepter</span>.
                Sans accord de tous, Mira reste éteinte.
              </p>
            </div>

            <div className="space-y-3 mb-5">
              <Transparency
                title="Qui écoute"
                body="Personne d'autre que vous. Le micro de cet appareil uniquement, dans cette pièce, pendant cette conversation."
                tone="green"
              />
              <Transparency
                title="Ce qui est analysé"
                body="Uniquement les affirmations factuelles vérifiables : dates, chiffres, distances, citations attribuées."
                tone="green"
              />
              <Transparency
                title="Ce qui n'est JAMAIS jugé"
                body="Vos opinions, vos ressentis, vos reproches, vos désaccords de fond. Mira ne prend aucun parti."
                tone="green"
              />
              <Transparency
                title="Ce qui n'est PAS stocké"
                body="Aucun enregistrement audio. Aucune transcription conservée. Tout est effacé à la fin, sauf le résumé que vous choisissez de garder."
                tone="amber"
              />
            </div>

            <div className="rounded-2xl border border-sand-200 divide-y divide-sand-200 mb-5 overflow-hidden">
              {participants.map(p => (
                <label key={p} className="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-sand-50 transition">
                  <input
                    type="checkbox"
                    checked={!!agreed[p]}
                    onChange={() => setAgreed(a => ({ ...a, [p]: !a[p] }))}
                    className="w-5 h-5 rounded-md accent-[#8aa893]"
                  />
                  <span className="text-sm text-stone-700">
                    <span className="font-medium">{p}</span> donne son consentement à l'écoute factuelle.
                  </span>
                </label>
              ))}
            </div>

            <button
              disabled={!all}
              onClick={onStart}
              className={"w-full rounded-2xl py-3.5 text-sm font-medium transition " +
                (all
                  ? "bg-[#8aa893] text-white hover:bg-[#7a9884] shadow-sm"
                  : "bg-sand-200 text-stone-400 cursor-not-allowed")}
            >
              {all ? "Tout le monde est d'accord — démarrer l'écoute" : "En attente du consentement de chacun"}
            </button>
            <p className="text-center text-[11px] text-stone-400 mt-3">
              Vous pourrez couper le micro à tout moment, d'un seul geste.
            </p>
          </div>
        </div>
      );
    }

    function Transparency({ title, body, tone }) {
      const dot = tone === 'amber' ? '#c9a36a' : '#8aa893';
      return (
        <div className="flex gap-3">
          <span className="mt-1.5 shrink-0 w-2 h-2 rounded-full" style={{ background: dot }}></span>
          <div>
            <p className="text-sm font-medium text-stone-700">{title}</p>
            <p className="text-[13px] text-stone-500 leading-relaxed">{body}</p>
          </div>
        </div>
      );
    }

    /* ─────────────────────  ÉCRAN 2 — CONVERSATION  ───────────────────── */
    function ConversationScreen({ onStop, onFinish, log, setLog }) {
      const [playing, setPlaying] = useState(true);
      const [idx, setIdx] = useState(0);
      const scrollRef = useRef(null);
      const timer = useRef(null);

      // Joue le script message par message tant que `playing`
      useEffect(() => {
        if (!playing) return;
        if (idx >= SCRIPT.length) return;
        timer.current = setTimeout(() => {
          setLog(l => [...l, SCRIPT[idx]]);
          setIdx(i => i + 1);
        }, idx === 0 ? 900 : 2600);
        return () => clearTimeout(timer.current);
      }, [idx, playing]);

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [log]);

      const done = idx >= SCRIPT.length;
      const flagged = log.filter(m => m.fact && m.fact.status !== 'ok').length;

      return (
        <div className="min-h-full flex flex-col">
          {/* Barre haute discrète */}
          <header className="sticky top-0 z-10 backdrop-blur bg-sand-100/80 border-b border-sand-200">
            <div className="max-w-lg mx-auto px-5 py-3 flex items-center gap-3">
              <Mark size={30} animated={playing && !done} />
              <div className="flex-1">
                <p className="text-sm font-medium text-stone-700 flex items-center gap-2">
                  {done ? "Écoute terminée" : playing ? "Mira écoute" : "En pause"}
                  {flagged > 0 && (
                    <span className="text-[11px] font-normal text-stone-400">
                      · {flagged} point{flagged>1?'s':''} signalé{flagged>1?'s':''}
                    </span>
                  )}
                </p>
                <p className="text-[11px] text-stone-400">Rien n'est enregistré · analyse factuelle seulement</p>
              </div>
              <Waveform active={playing && !done} />
            </div>
          </header>

          {/* Fil de conversation */}
          <div ref={scrollRef} className="flex-1 overflow-y-auto">
            <div className="max-w-lg mx-auto px-5 py-6 space-y-4">
              {log.length === 0 && (
                <p className="text-center text-sm text-stone-400 mt-10 softpulse">À l'écoute de la conversation…</p>
              )}
              {log.map(m => (
                <div key={m.id} className="risein">
                  <div className="flex items-start gap-3">
                    <div className={"shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-semibold text-white " + m.color}>
                      {m.speaker[0]}
                    </div>
                    <div className="flex-1">
                      <p className="text-[11px] text-stone-400 mb-0.5">{m.speaker}</p>
                      <div className="inline-block bg-white rounded-2xl rounded-tl-sm px-4 py-2.5 shadow-sm">
                        <p className="text-sm text-stone-700 leading-relaxed">{m.text}</p>
                      </div>
                      {m.fact && m.fact.status !== 'ok' && <FactCard fact={m.fact} />}
                    </div>
                  </div>
                </div>
              ))}

              {done && (
                <div className="risein pt-2 text-center">
                  <p className="text-sm text-stone-500">La conversation est terminée.</p>
                </div>
              )}
            </div>
          </div>

          {/* Barre de contrôle */}
          <footer className="sticky bottom-0 border-t border-sand-200 bg-sand-100/90 backdrop-blur">
            <div className="max-w-lg mx-auto px-5 py-3 flex items-center gap-3">
              {!done ? (
                <>
                  <button
                    onClick={() => setPlaying(p => !p)}
                    className="flex-1 rounded-xl py-2.5 text-sm font-medium bg-white text-stone-600 hover:bg-sand-50 border border-sand-200 transition"
                  >
                    {playing ? "⏸ Mettre en pause" : "▶ Reprendre"}
                  </button>
                  <button
                    onClick={onStop}
                    className="rounded-xl py-2.5 px-4 text-sm font-medium text-stone-500 hover:text-stone-700 transition"
                  >
                    Couper le micro
                  </button>
                </>
              ) : (
                <button
                  onClick={onFinish}
                  className="flex-1 rounded-xl py-3 text-sm font-medium bg-[#8aa893] text-white hover:bg-[#7a9884] transition shadow-sm"
                >
                  Voir le résumé apaisé
                </button>
              )}
            </div>
          </footer>
        </div>
      );
    }

    /* ─────────────────────  ÉCRAN 3 — RÉSUMÉ  ───────────────────── */
    function SummaryScreen({ log, onRestart }) {
      const facts = log.filter(m => m.fact);
      const counts = {
        disputed: facts.filter(f => f.fact.status === 'disputed').length,
        unverifiable: facts.filter(f => f.fact.status === 'unverifiable').length,
        ok: facts.filter(f => f.fact.status === 'ok').length,
      };

      return (
        <div className="min-h-full flex items-center justify-center p-5">
          <div className="w-full max-w-lg bg-white rounded-3xl shadow-[0_10px_40px_-15px_rgba(80,70,50,0.25)] p-7 risein">
            <div className="flex items-center gap-3 mb-1">
              <Mark size={36} />
              <h1 className="text-xl font-semibold text-stone-800">Résumé de la conversation</h1>
            </div>
            <p className="text-sm text-stone-500 mb-5 leading-relaxed">
              Voici uniquement les <span className="font-medium">faits vérifiables</span> qui ont été évoqués.
              Pas de gagnant, pas de perdant — juste de quoi avancer ensemble.
            </p>

            <div className="flex gap-2 mb-6">
              <Stat n={counts.disputed} label="à vérifier" color="#c9a36a" />
              <Stat n={counts.unverifiable} label="à trancher" color="#9aa6b2" />
              <Stat n={counts.ok} label="confirmés" color="#8aa893" />
            </div>

            <div className="space-y-3 max-h-[42vh] overflow-y-auto pr-1">
              {facts.map((m, i) => {
                const meta = STATUS_META[m.fact.status];
                return (
                  <div key={i} className="rounded-2xl border border-sand-200 p-4">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="w-2 h-2 rounded-full" style={{ background: meta.dot }}></span>
                      <span className="text-[11px] uppercase tracking-wider text-stone-400">{meta.label}</span>
                    </div>
                    <p className="text-sm font-medium text-stone-700">{m.fact.claim}</p>
                    <p className="text-[13px] text-stone-500 mt-1 leading-relaxed">{m.fact.note}</p>
                    <p className="text-[11px] text-stone-400 mt-2">Source : {m.fact.source}</p>
                  </div>
                );
              })}
            </div>

            <div className="rounded-2xl bg-sand-100 p-4 mt-5">
              <p className="text-[13px] text-stone-500 leading-relaxed">
                Mira n'a pas relevé les avis, ressentis ou reproches échangés — ce sont les vôtres,
                et eux seuls méritent d'être discutés entre vous.
              </p>
            </div>

            <p className="text-center text-[11px] text-stone-400 mt-4">
              Aucun audio ni transcription n'a été conservé. Ce résumé disparaîtra si vous ne le gardez pas.
            </p>

            <button
              onClick={onRestart}
              className="w-full mt-4 rounded-2xl py-3 text-sm font-medium bg-white border border-sand-200 text-stone-600 hover:bg-sand-50 transition"
            >
              Rejouer la démo
            </button>
          </div>
        </div>
      );
    }

    function Stat({ n, label, color }) {
      return (
        <div className="flex-1 rounded-2xl bg-sand-50 border border-sand-200 py-3 text-center">
          <div className="text-2xl font-semibold" style={{ color }}>{n}</div>
          <div className="text-[11px] text-stone-400 mt-0.5">{label}</div>
        </div>
      );
    }

    /* ─────────────────────  APP  ───────────────────── */
    function App() {
      const [stage, setStage] = useState('consent'); // consent | live | summary
      const [log, setLog] = useState([]);

      const start = () => { setLog([]); setStage('live'); };
      const restart = () => { setLog([]); setStage('consent'); };

      return (
        <div className="min-h-full font-sans text-stone-800 antialiased">
          {stage === 'consent' && <ConsentScreen onStart={start} />}
          {stage === 'live' && (
            <ConversationScreen
              log={log} setLog={setLog}
              onStop={() => setStage('summary')}
              onFinish={() => setStage('summary')}
            />
          )}
          {stage === 'summary' && <SummaryScreen log={log} onRestart={restart} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
